<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerAI — AI-Powered Resume & Interview Coach (SIH Edition)</title>
  <link rel="stylesheet" href="css/style.css?v=3.0.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
</head>
<body>

  <div class="app-container">
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar" id="main-sidebar">
      <div class="sidebar-top">
        <!-- Brand Logo -->
        <div class="brand-container">
          <a href="#" class="brand-logo">
            <div class="brand-icon-wrap">C</div>
            <div class="brand-text">
              <h1>CareerAI</h1>
              <span>Pro Coach Edition</span>
            </div>
          </a>
        </div>

        <!-- Navigation Links -->
        <nav class="sidebar-nav">
          <a class="nav-link active" data-route="dashboard" data-view="dashboard" href="#dashboard">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
            <span>Overview</span>
          </a>

          <a class="nav-link" data-route="resume" data-view="resume-builder" href="#resume">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <span>Resume Lab</span>
          </a>

          <a class="nav-link" data-route="interview" data-view="interview-prep" href="#interview">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"></path></svg>
            <span>AI Mock Interview</span>
          </a>

          <a class="nav-link" data-route="tracker" data-view="job-tracker" href="#tracker">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            <span>Job Tracker</span>
          </a>

          <a class="nav-link" data-route="analytics" data-view="performance" href="#analytics">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            <span>Career Readiness</span>
          </a>

          <a class="nav-link" data-route="settings" data-view="settings" href="#settings">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span>Settings</span>
          </a>
        </nav>
      </div>

      <!-- Bottom User Profile Footer -->
      <div class="sidebar-user-footer" style="padding: 14px 16px; border-top: 1px solid var(--border-light); display: flex; align-items: center; gap: 10px;">
        <img id="sidebar-user-avatar" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=150&auto=format&fit=crop&q=80" alt="Avatar" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--primary); flex-shrink: 0;">
        <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
          <div id="sidebar-user-name" style="font-weight: 700; font-size: 0.86rem; color: #0F172A;">Priya Sharma</div>
          <div id="sidebar-user-plan" style="font-size: 0.72rem; color: var(--primary); font-weight: 600;">Pro Coach Edition</div>
        </div>
      </div>
    </aside>

    <!-- Main Content App Canvas -->
    <main class="main-content">
      <!-- Top Header Bar -->
      <header class="top-header" style="height: 64px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; padding: 0 28px; background: white; position: sticky; top: 0; z-index: 40;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <button id="mobile-menu-btn" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; display: none;">☰</button>
          <div style="font-weight: 800; font-size: 1.1rem; color: #0F172A;">CareerAI Workspace</div>
        </div>

        <div style="display: flex; align-items: center; gap: 14px;">
          <button id="header-auth-btn" style="background: #F8FAFC; border: 1px solid #E2E8F0; padding: 6px 14px; border-radius: 9999px; font-size: 0.82rem; font-weight: 700; cursor: pointer; display: flex; align-items: center;">
            Profile
          </button>
        </div>
      </header>

      <!-- Dynamic Content Injection Container -->
      <div id="main-content-body" class="content-body" style="padding: 24px 28px; max-width: 1300px; margin: 0 auto;">
        <!-- Views rendered by appController -->
      </div>
    </main>
  </div>

  <!-- Global Toast Notifications Container -->
  <div id="global-toast-container" class="toast-container" style="position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px;"></div>

  <!-- PDF.js & Mammoth.js for Client-Side Resume Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <!-- Application Entry Point -->
  <script type="module" src="js/app.js?v=3.0.0"></script>
</body>
</html>
